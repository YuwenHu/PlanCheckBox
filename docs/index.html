          '完成状态保存在本机，刷新或重新载入同一批文件都能继续。</p>' +
        '<div class="drop card">' +
          '<span class="drop-badge">JSON</span>' +
          '<label class="btn btn-primary" for="fileInput">选择文件</label>' +
          '<div class="muted small">支持多选，也可分多次追加；建议同时载入健身组，月度/周度页会汇总健身任务</div>' +
        '</div>' +
        '<div class="file-section">' +
          '<div class="section-head"><h2>已选择</h2>' +
            '<span class="muted small">' + files.length + ' 个文件 · ' + valid + ' 个可用</span></div>' +
          (files.length ? '<div class="file-list">' + rows + '</div>'
            : '<div class="empty-state">还没有选择文件。选择示例数据可先用 <code>demo/</code> 下的文件跑通四页。</div>') +
        '</div>' +
        autosaveBlock(ctx) +
        '<div class="page-actions">' +
          '<button class="btn" type="button" data-act="clear-files"' + (files.length ? '' : ' disabled') + '>清空</button>' +
          '<button class="btn btn-primary" type="button" data-act="to-overview"' + (valid ? '' : ' disabled') + '>进入总览</button>' +
        '</div>' +
      '</section>';
  }

  /* ---- 第 2 页：总览 ---- */
  /* ---- 第 2 页：年度贡献热力图 ---- */
  function heatmap(ctx) {
    var map = Model.completionByDay(ctx.groups);
    var uniq = Model.uniqueTaskStats(ctx.groups);
    var years = Object.create(null);
    ctx.groups.forEach(function (g) {
      g.tasks.forEach(function (t) {
        if (t.dateObj && !isNaN(t.dateObj.getTime())) years[t.dateObj.getFullYear()] = true;
        if (t.done && t.doneAt) {
          var d = new Date(t.doneAt);
          if (!isNaN(d.getTime())) years[d.getFullYear()] = true;
        }
      });
    });
    var yearList = Object.keys(years).map(Number).sort(function (a, b) { return a - b; });
    var nowYear = new Date().getFullYear();
    var selected = ctx.heatYear;
    if (!selected || (yearList.length && yearList.indexOf(selected) < 0)) {
      selected = yearList.indexOf(nowYear) >= 0 ? nowYear : (yearList[0] || nowYear);
    }
    var rangeYears = [];
    if (yearList.length) {
      for (var yy = yearList[0]; yy <= yearList[yearList.length - 1]; yy++) rangeYears.push(yy);
    } else { rangeYears = [nowYear]; }

    var totalDone = 0;
    Object.keys(map).forEach(function (k) { totalDone += map[k]; });
    var yearDone = 0;
    Object.keys(map).forEach(function (k) { if (Number(k.slice(0, 4)) === selected) yearDone += map[k]; });

    var first = new Date(selected, 0, 1);
    var last = new Date(selected, 11, 31);
    var lead = (first.getDay() + 6) % 7;
    var start = addDays(first, -lead);
    var tail = (last.getDay() + 6) % 7;
    var end = addDays(last, 6 - tail);
    var weekCount = Math.floor((end - start) / 86400000 / 7) + 1;

    var monthsHtml = '', prevWeek = 0;
    for (var mi = 1; mi <= 12; mi++) {
      var mFirst = new Date(selected, mi - 1, 1);
      var stWeek = Math.floor((addDays(mFirst, -((mFirst.getDay() + 6) % 7)) - start) / 86400000 / 7);
      var mLast = new Date(selected, mi, 0);
      var enWeek = Math.floor((addDays(mLast, -((mLast.getDay() + 6) % 7)) - start) / 86400000 / 7);
      var span = Math.max(1, enWeek - stWeek + 1);
      monthsHtml += '<span class="heat-month" style="width:' + (span * 15 - 3) + 'px">' + mi + '月</span>';
      prevWeek = enWeek + 1;
    }

    var cellsHtml = '';
    for (var w = 0; w < weekCount; w++) {
      for (var di = 0; di < 7; di++) {
        var day = addDays(start, w * 7 + di);
        if (day.getFullYear() !== selected) {
          cellsHtml += '<span class="heat-cell is-out"></span>';
          continue;
        }
        var dotKey = day.getFullYear() + '-' + p2(day.getMonth() + 1) + '-' + p2(day.getDate());
        var n = map[dotKey] || 0;
        var lv = n === 0 ? '' : n <= 2 ? ' lv1' : n <= 5 ? ' lv2' : ' lv3';
        var title = (day.getMonth() + 1) + '月' + day.getDate() + '日 · 完成 ' + n + ' 项';
        cellsHtml += '<button type="button" class="heat-cell' + lv +
          (ctx.heatTip === dotKey ? ' is-active' : '') + '" data-act="heat-day" data-date="' + dotKey +
          '" title="' + U.esc(title) + '" aria-label="' + U.esc(title) + '"></button>';
      }
    }

    var yearBtns = rangeYears.length > 1 ? '<div class="heat-years">' + rangeYears.map(function (y) {
      return '<button type="button" class="heat-year' + (y === selected ? ' is-active' : '') +
        '" data-act="heat-year" data-year="' + y + '">' + y + ' 年</button>';
    }).join('') + '</div>' : '';

    var tip = '';
    if (ctx.heatTip) {
      var parts = ctx.heatTip.split('-');
      tip = '<span class="heat-tip">' + Number(parts[1]) + '月' + Number(parts[2]) + '日 · 完成 ' +
        (map[ctx.heatTip] || 0) + ' 项</span>';
    }
    return '' +
      '<div class="heat-card card">' +
        '<div class="heat-head"><span class="heat-title">年度完成热力图</span>' + yearBtns + '</div>' +
        '<div class="heat-scroll"><div class="heat-inner">' +
          '<div class="heat-months">' + monthsHtml + '</div>' +
          '<div class="heat-grid" data-year="' + selected + '">' + cellsHtml + '</div>' +
        '</div></div>' +
        '<div class="heat-foot">' +
          '<span>本年完成 ' + yearDone + ' 项，累计 ' + uniq.total + ' 项任务，完成率 ' +
            (uniq.total ? Math.round(uniq.done * 100 / uniq.total) : 0) + '%</span>' + tip +
        '</div>' +
        (totalDone ? '' : '<div class="heat-empty">暂无完成记录</div>') +
      '</div>';
  }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }

  /* ---- 第 2 页：当月全部科目月历（多科目并列） ---- */
  function overviewMonthBase(ctx) {
    var m = /^(\d{4})-(\d{2})$/.exec(ctx.ovMonth || '');
    if (m) {
      var y = +m[1], mo = +m[2] - 1;
      if (mo >= 0 && mo <= 11) return new Date(y, mo, 1);
    }
    var now = ctx.now || new Date();
    return new Date(now.getFullYear(), now.getMonth(), 1);
  }
  /* 同一格内按科目并列：最多 3 科，超出显示 +N 科，避免拥挤 */
  function subjectChips(tasks, metaByFile) {
    var list = [], map = Object.create(null);
    tasks.forEach(function (t) {
      if (!map[t.groupFile]) {
        map[t.groupFile] = { fileName: t.groupFile, name: t.groupName, tasks: [] };
        list.push(map[t.groupFile]);
      }
      map[t.groupFile].tasks.push(t);
    });
    var shown = list.slice(0, 3), rest = list.length - shown.length;
    var html = shown.map(function (s) {
      var m = metaByFile[s.fileName] || { name: s.name || s.fileName, color: Model.groupColor(s.fileName) };
      var st = Model.stats(s.tasks);
      return '<span class="cal-subj' + (st.total && st.done === st.total ? ' is-done' : '') +
        '" style="--sc:' + m.color.strong + ';--sc-soft:' + m.color.soft + '" title="' +
        U.esc(m.name + '：已完成 ' + st.done + '/' + st.total + ' 项') + '">' +
        '<i></i><b>' + U.esc(m.name) + '</b>' + st.done + '/' + st.total + '</span>';
    }).join('');
    return html + (rest > 0 ? '<span class="cal-more">+' + rest + ' 科</span>' : '');
  }
  function overviewCalendar(ctx) {
    var ordered = Model.sortGroups(ctx.groups);
    if (!ordered.length) return '';
    var base = overviewMonthBase(ctx);
    var y = base.getFullYear(), mo = base.getMonth();
    var now = ctx.now || new Date();
    var isCurMonth = y === now.getFullYear() && mo === now.getMonth();
    var lead = (base.getDay() + 6) % 7;   // 周一起始，与单科目月历一致
    var daysInMonth = new Date(y, mo + 1, 0).getDate();
    var slots = Math.ceil((lead + daysInMonth) / 7) * 7;

    var metaByFile = Object.create(null), order = Object.create(null);
    ordered.forEach(function (g, i) {
      metaByFile[g.fileName] = { rank: i, name: g.meta.groupName, color: Model.groupColor(g.meta.groupName) };
      order[g.fileName] = i;
    });

    var byDate = Object.create(null), monthTasks = [];
    ordered.forEach(function (g) {
      g.tasks.forEach(function (t) {
        var d = t.dateObj;
        if (!d || isNaN(d.getTime()) || d.getFullYear() !== y || d.getMonth() !== mo) return;
        if (!byDate[t.date]) byDate[t.date] = [];
        byDate[t.date].push(t);
        monthTasks.push(t);
      });
    });
    var countByFile = Object.create(null);
    monthTasks.forEach(function (t) { countByFile[t.groupFile] = (countByFile[t.groupFile] || 0) + 1; });
    var subjCount = Object.keys(countByFile).length;
    var mst = Model.stats(monthTasks);

    var cells = '';
    for (var i = 0; i < slots; i++) {
      var dayNum = i - lead + 1;
      if (dayNum < 1 || dayNum > daysInMonth) {
        cells += '<div class="cal-cell cal-cell--multi is-empty" aria-hidden="true"></div>';
        continue;
      }
      var key = y + '-' + p2(mo + 1) + '-' + p2(dayNum);
      var tasks = (byDate[key] || []).slice().sort(function (a, b) {
        var ra = order[a.groupFile] == null ? 999 : order[a.groupFile];
        var rb = order[b.groupFile] == null ? 999 : order[b.groupFile];
        return ra - rb || Model.prioRank(a) - Model.prioRank(b) ||
          (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      });
      var st = Model.stats(tasks);
      cells += '<button type="button" class="cal-cell cal-cell--multi" data-act="open-day" data-date="' + key +
        '" aria-label="查看 ' + key + ' 全部科目任务">' +
          '<span class="cal-day">' + dayNum + (tasks.length ? '<em>' + tasks.length + ' 项</em>' : '') + '</span>' +
          subjectChips(tasks, metaByFile) +
          '<span class="cal-min">' + (st.minutes ? Model.fmtMinutes(st.minutes) : '') + '</span>' +
        '</button>';
    }
    var weekday = ['一', '二', '三', '四', '五', '六', '日'].map(function (w) {
      return '<div class="cal-weekday">' + w + '</div>';
    }).join('');
    var legend = ordered.filter(function (g) { return countByFile[g.fileName]; }).map(function (g) {
      return '<span class="cal-legend-item"><span class="cal-legend-dot" style="background:' +
        Model.groupColor(g.meta.groupName).strong + '"></span>' + U.esc(g.meta.groupName) +
        ' <b>' + countByFile[g.fileName] + '</b></span>';
    }).join('');

    return '' +
      '<div class="month-cal card">' +
        '<div class="cal-head">' +
          '<span class="cal-title">' + (mo + 1) + '月日历 · 全部科目</span>' +
          '<span class="cal-note">本月 ' + mst.total + ' 项 · 已完成 ' + mst.done + ' 项' +
            (subjCount ? ' · ' + subjCount + ' 个科目' : '') + '</span>' +
          '<div class="cal-nav">' +
            (isCurMonth ? '' : '<button class="btn btn-small" type="button" data-act="ov-month-today">回到本月</button>') +
            '<button class="btn btn-small" type="button" data-act="ov-month-prev" aria-label="上一月">‹ 上月</button>' +
            '<button class="btn btn-small" type="button" data-act="ov-month-next" aria-label="下一月">下月 ›</button>' +
          '</div>' +
        '</div>' +
        '<div class="cal-scroll"><div class="calendar">' + weekday + cells + '</div></div>' +
        (legend ? '<div class="cal-legend">' + legend + '</div>' : '') +
        '<div class="cal-note" style="margin-top:6px">同一格内按科目并列展示（最多 3 科，超出显示 +N 科）；' +
          '点击日期查看当日全部科目任务。科目顺序与上方组横条一致。</div>' +
      '</div>';
  }

  /* 当日任务弹层（总览页）：全部科目并列，按科目优先级 → 任务优先级排序 */
  function overviewDayDetail(ctx) {
    var key = ctx.dayDetail;
    if (!key) return '';
    var d = Parser.parseISODate(key);
    if (!d) return '';
    var ordered = Model.sortGroups(ctx.groups);
    var order = Object.create(null), colorByFile = Object.create(null), nameByFile = Object.create(null);
    ordered.forEach(function (g, i) {
      order[g.fileName] = i;
      colorByFile[g.fileName] = Model.groupColor(g.meta.groupName);
      nameByFile[g.fileName] = g.meta.groupName;
    });
    var seen = Object.create(null), tasks = [];
    ordered.forEach(function (g) {
      g.tasks.forEach(function (t) {
        if (t.date !== key) return;
        var k = t.groupFile + '::' + t.id;
        if (seen[k]) return;
        seen[k] = 1;
        tasks.push(t);
      });
    });
    tasks.sort(function (a, b) {
      var ra = order[a.groupFile] == null ? 999 : order[a.groupFile];
      var rb = order[b.groupFile] == null ? 999 : order[b.groupFile];
      return ra - rb || Model.prioRank(a) - Model.prioRank(b) ||
        (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
    });
    var st = Model.stats(tasks);
    var files = Object.create(null);
    tasks.forEach(function (t) { files[t.groupFile] = true; });
    var subjectCount = Object.keys(files).length;
    var rows = tasks.map(function (t) {
      var c = colorByFile[t.groupFile] || Model.groupColor(t.groupFile);
      var was = t.done ? Model.doneText(t, ctx.now) : Model.lastDoneText(t, ctx.now);
      return '<li class="cal-day-row' + (t.done ? ' is-done' : '') + '">' +
        '<span class="cal-subj cal-subj--tag" style="--sc:' + c.strong + ';--sc-soft:' + c.soft + '">' +
          '<i></i><b>' + U.esc(nameByFile[t.groupFile] || t.groupName) + '</b></span>' +
        prioBadge(t.priority) +
        '<span class="task-title">' + U.esc(t.title) + '</span>' +
        '<span class="task-meta">' + Model.fmtMinutes(t.minutes) +
          (t.slot ? '<span>' + U.esc(t.slot) + '</span>' : '') +
          (was ? '<span class="task-was">' + U.esc(was) + '</span>' : '') +
        '</span></li>';
    }).join('');
    return '' +
      '<div class="cal-detail" role="dialog" aria-modal="true" aria-label="当日全部科目任务">' +
        '<div class="cal-modal">' +
          '<div class="cal-modal-head">' +
            '<div><h3>' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + Model.weekdayText(d) + '</h3>' +
              '<div class="cal-modal-sub">共 ' + st.total + ' 项 · 已完成 ' + st.done + ' 项 · 总时长 ' +
                (st.minutes ? Model.fmtMinutes(st.minutes) : '0 分钟') +
                (subjectCount ? ' · ' + subjectCount + ' 个科目' : '') + '</div></div>' +
            '<button class="btn btn-small" type="button" data-act="close-day">关闭</button>' +
          '</div>' +
          (tasks.length
            ? '<ul class="cal-day-list">' + rows + '</ul>'
            : '<div class="empty-state" style="margin-top:10px">当日暂无任务</div>') +
        '</div>' +
      '</div>';
  }

  function page2(ctx) {
    if (!ctx.groups.length) {
      return '<section class="page"><div class="empty-state">还没有可用的题库，请先返回选择文件。</div></section>';
    }
    var sorted = Model.sortGroups(ctx.groups);
    var totalTasks = 0;
    var cards = sorted.map(function (g) {
      totalTasks += g.tasks.length;
      var c = Model.groupColor(g.meta.groupName);
      var st = Model.stats(g.tasks);
      var topics = Model.topicSummaries(g);
      return '' +
        '<article class="group-card" role="button" tabindex="0" data-act="open-group" data-file="' + U.esc(g.fileName) +
          '" style="' + groupStyle(g) + '">' +
          '<div class="group-head">' +
            '<div>' +
              '<div class="group-name">' + U.esc(g.meta.groupName) + '</div>' +
              '<div class="group-sub">' + U.esc(g.meta.subject) + '</div>' +
            '</div>' +
            '<span class="kind-tag ' + (g.meta.kind === 'fitness' ? 'kind-fitness' : 'kind-study') + '">' +
              (g.meta.kind === 'fitness' ? '健身' : '学习') + '</span>' +
          '</div>' +
          '<div class="topic-list">' +
            topics.map(function (t) {
              return '<span class="topic-item"><b>' + U.esc(t.topic) + '</b>' +
                t.texts.map(function (x) { return '<span class="ym">' + U.esc(x) + '</span>'; }).join('') + '</span>';
            }).join('') +
          '</div>' +
          '<div class="card-progress">' +
            progressBar({
              label: '任务完成',
              stats: st,
              color: c.strong,
              prediction: Model.predict(g.tasks, g.meta.planStart, ctx.now)
            }) +
          '</div>' +
        '</article>';
    }).join('');

    return '' +
      '<section class="page page-2">' +
        '<div class="page-head"><h1>总览</h1><span class="muted small">' + ctx.groups.length + ' 组 · ' + totalTasks + ' 项任务</span></div>' +
        '<p class="lead">点击组横条进入月度安排。灰色文字是该组的「板块 月份」汇总。</p>' +
        heatmap(ctx) +
        overviewCalendar(ctx) +
        '<div class="group-grid">' + cards + '</div>' +
        overviewDayDetail(ctx) +
      '</section>';
  }

  function shortDate(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

  /* ---- 第 3 页：月度 ---- */
  function page3(ctx) {
    var g = ctx.group;
    if (!g) return '<section class="page"><div class="empty-state">该组数据已不可用，请返回总览重新选择。</div></section>';
    var months = Model.monthEntries(g);
    var month = ctx.month || months[0];
    var isFit = g.meta.kind === 'fitness';
    var monthTasks = month ? Model.tasksInMonth(g, month) : [];
    /* 顶部只统计当前任务组自身的类型：学习组只看学习，健身组只看健身 */
    var ownMonth = monthTasks.filter(function (t) { return t.kind === g.meta.kind; });
    var ownStats = Model.stats(ownMonth);
    var c = Model.groupColor(g.meta.groupName);
    /* 月份排序：未完成月份保持时间顺序在前，全部完成的月份沉到最后 */
    var openMonths = [], doneMonths = [];
    months.forEach(function (m) {
      (Model.allDone(Model.tasksInMonth(g, m)) ? doneMonths : openMonths).push(m);
    });
    var displayMonths = openMonths.concat(doneMonths);

    var chips = displayMonths.map(function (m) {
      return '<button class="chip' + (month && m.id === month.id ? ' is-active' : '') + '" type="button" ' +
        'data-act="select-month" data-month="' + U.esc(m.id) + '">' + U.esc(m.label) + '</button>';
    }).join('');

    var cards = displayMonths.map(function (m) {
      var tasks = Model.sortForDisplay(Model.tasksInMonth(g, m));
      var st = Model.stats(tasks);
      var complete = Model.allDone(tasks);
      return '' +
        '<article class="month-card card' + (complete ? ' is-complete' : '') + '" role="button" tabindex="0" data-act="open-month" data-month="' + U.esc(m.id) + '">' +
          '<div class="month-head">' +
            '<div>' +
              '<h2>' + U.esc(m.label) + (complete ? '<span class="month-done-tag">已完成</span>' : '') + '</h2>' +
              '<div class="muted small">' + st.total + ' 项 · 已完成 ' + st.done + ' 项 · 共 ' + Model.fmtMinutes(st.minutes) + '</div>' +
            '</div>' +
            '<span class="chev">进入周度 →</span>' +
          '</div>' +
          (tasks.length
            ? '<ul class="task-list">' + tasks.map(function (t) {
                var was = t.done ? Model.doneText(t, ctx.now) : Model.lastDoneText(t, ctx.now);
                return '<li class="task-line' + (t.done ? ' is-done' : '') + '">' + prioBadge(t.priority) +
                  '<span class="task-title">' + U.esc(t.title) + '</span>' +
                  '<span class="task-meta">' +
                    (t.kind === 'fitness' ? '<span class="tag tag--fitness">健身</span>' : '') +
                    '<span>' + shortDate(t.dateObj) + '</span>' +
                    '<span>' + Model.fmtMinutes(t.minutes) + '</span>' +
                    (was ? '<span class="task-was">' + U.esc(was) + '</span>' : '') +
                  '</span></li>';
              }).join('') + '</ul>'
            : '<div class="empty-state" style="margin-top:12px">该月暂无任务</div>') +
        '</article>';
    }).join('');

    return '' +
      '<section class="page page-3">' +
        '<div class="page-head">' +
          '<button class="btn btn-small" type="button" data-act="back">← 返回总览</button>' +
          '<h1>' + U.esc(g.meta.groupName) + ' <span class="muted">· 月度</span></h1>' +
        '</div>' +
        '<p class="lead">顶部只显示本组类型（' + (isFit ? '健身' : '学习') + '）的进度；下方按月列出任务，已完成任务沉到月内末尾。</p>' +
        '<div class="month-tabs">' + chips + '</div>' +
        '<div class="stat-panel card">' +
          '<div>' + progressBar({
            label: isFit ? '健身' : '学习', stats: ownStats, color: isFit ? '#d9901f' : c.strong,
            emptyWord: isFit ? '健身任务' : '学习任务',
            prediction: Model.predict(ownMonth, g.meta.planStart, ctx.now)
          }) + '</div>' +
          '<div class="stat-scope">统计范围：' + U.esc(month ? month.label : '—') +
            '（' + (isFit ? '健身' : '学习') + ' = 本组该月任务）</div>' +
        '</div>' +
        '<div class="month-list">' + (cards || '<div class="empty-state">该组没有月份数据</div>') + '</div>' +
      '</section>';
  }

  /* ---- 第 4 页：周度 ---- */
  function page4(ctx) {
    var g = ctx.group;
    if (!g) return '<section class="page"><div class="empty-state">该组数据已不可用，请返回总览重新选择。</div></section>';
    var months = Model.monthEntries(g);
    var month = ctx.month || months[0];
    var weeks = month ? month.weeks : [];
    var active = ctx.activeWeek || (weeks[0] ? (g.fileName + '#' + month.id + '#' + weeks[0].id) : '');
    var c = Model.groupColor(g.meta.groupName);

    var weekCards = weeks.map(function (w) {
      var key = g.fileName + '#' + month.id + '#' + w.id;
      var tasks = Model.weekTasks(g, ctx.groups, w.startObj, w.endObj);
      var st = Model.stats(tasks);
      var open = !!ctx.expanded[key];
      var body = '';
      if (open) {
        var days = Model.groupByDay(tasks);
        body = '<div class="week-body">' + (days.length ? days.map(function (d) {
          var dst = Model.stats(d.tasks);
          return '<div class="day-group">' +
            '<div class="day-head">' + shortDate(d.dateObj) + ' ' + Model.weekdayText(d.dateObj) +
              '<span class="muted">' + dst.total + ' 项 · 约 ' + Model.fmtMinutes(dst.minutes) + '</span></div>' +
            d.tasks.map(function (t) { return taskRow(t, g, ctx); }).join('') +
          '</div>';
        }).join('') : '<div class="empty-state" style="margin-top:10px">本周没有任务</div>') + '</div>';
      }
      return '' +
        '<section class="week-card card' + (open ? ' is-open' : '') + '">' +
          '<button class="week-head" type="button" data-act="toggle-week" data-week="' + U.esc(key) + '" ' +
            'aria-expanded="' + (open ? 'true' : 'false') + '">' +
            '<span class="week-head-main">' +
              '<span class="week-title">' + U.esc(w.label + '，' + Model.fmtRange(w.startObj, w.endObj)) + '</span>' +
              '<span class="week-sub muted">' + st.total + ' 项 · 已完成 ' + st.done + ' 项 · 约 ' + Model.fmtMinutes(st.minutes) + '</span>' +
            '</span>' +
            '<span class="week-progress"><b>' + st.pct + '%</b> ' + st.done + '/' + st.total + '</span>' +
            '<span class="chev-arrow">▾</span>' +
          '</button>' +
          body +
        '</section>';
    }).join('');

    var range = null, activeWeek = null;
    for (var i = 0; i < weeks.length; i++) {
      var k = g.fileName + '#' + month.id + '#' + weeks[i].id;
      if (k === active) { activeWeek = weeks[i]; break; }
    }
    if (!activeWeek) activeWeek = weeks[0] || null;
    if (activeWeek) range = { start: activeWeek.startObj, end: activeWeek.endObj };

    var isFit = g.meta.kind === 'fitness';
    var ownTasks = range ? Model.tasksInRange(g.tasks, range.start, range.end).filter(function (t) {
      return t.kind === g.meta.kind;
    }) : [];
    var ownStats = Model.stats(ownTasks);

    return '' +
      '<section class="page page-4">' +
        '<div class="page-head">' +
          '<button class="btn btn-small" type="button" data-act="back">← 返回月度</button>' +
          '<h1>' + U.esc(g.meta.groupName) + ' <span class="muted">· ' + U.esc(month ? month.label : '') + ' · 周度</span></h1>' +
        '</div>' +
        '<p class="lead">点击周卡片原地展开或收起；勾选即完成并记录当时时间戳，取消勾选会记录一次撤销，最近完成时间仍保留。</p>' +
        '<div class="stat-panel card">' +
          '<div>' + progressBar({
            label: isFit ? '健身' : '学习', stats: ownStats, color: isFit ? '#d9901f' : c.strong,
            emptyWord: isFit ? '健身任务' : '学习任务',
            prediction: Model.predict(ownTasks, g.meta.planStart, ctx.now)
          }) + '</div>' +
          '<div class="stat-scope">统计范围：' + (activeWeek
            ? U.esc(activeWeek.label + '，' + Model.fmtRange(activeWeek.startObj, activeWeek.endObj))
            : '本周') + '（' + (isFit ? '健身' : '学习') + ' = 本组该周任务）</div>' +
        '</div>' +
        '<div class="week-list">' + (weekCards || '<div class="empty-state">该月没有周数据</div>') + '</div>' +
      '</section>';
  }

  /* 周度任务行：学习/健身用左边框色 + 标签区分 */
  function taskRow(t, group, ctx) {
    var isFit = t.kind === 'fitness';
    return '' +
      '<label class="task-row ' + (isFit ? 'task-row--fitness' : 'task-row--study') + (t.done ? ' is-done' : '') + '">' +
        '<input type="checkbox" data-file="' + U.esc(t.groupFile) + '" data-task-id="' + U.esc(t.id) + '"' +
          (t.done ? ' checked' : '') + ' />' +
        '<span class="task-body">' +
          '<span class="task-title">' + U.esc(t.title) + '</span>' +
          '<span class="task-meta">' + prioBadge(t.priority) +
            '<span>' + Model.fmtMinutes(t.minutes) + '</span>' +
            (t.slot ? '<span>' + U.esc(t.slot) + '</span>' : '') +
            (isFit ? '<span class="tag tag--fitness">健身</span>' : '') +
          '</span>' +
        '</span>' +
        '<span class="task-time' + (t.done ? ' is-done' : '') + '">' + U.esc(Model.lastDoneText(t, ctx.now)) + '</span>' +
      '</label>';
  }

  return {
    page1: page1, page2: page2, page3: page3, page4: page4,
    progressBar: progressBar, prioBadge: prioBadge, groupStyle: groupStyle
  };
})();

/* =============================================================================
 * 模块 5  状态、动作与路由  App / Actions / Router
 * 路由用内部状态切换，不刷新页面；页面之间通过 route + 模型查询衔接
 * ========================================================================== */
var App = {
  files: [],            // {fileName, displayName, raw, group, error, text, digest, format, lastModified}
  groups: [],           // 解析成功的组模型
  route: { page: 1, groupFile: null, monthId: null },
  expanded: Object.create(null),  // 周卡片展开状态
  activeWeek: '',
  heatYear: null,       // 热力图选中的年份
  heatTip: '',          // 热力图点选的日期
  ovMonth: '',          // 总览页「全部科目月历」当前月份（YYYY-MM，空表示当月）
  dayDetail: ''         // 月历展开的日期
};

function findGroup(fileName) {
  for (var i = 0; i < App.groups.length; i++) {
    if (App.groups[i].fileName === fileName) return App.groups[i];
  }
  return null;
}
function rebuildGroups() {
  App.groups = App.files.filter(function (f) { return f.group; }).map(function (f) { return f.group; });
  Model.applyProgress(App.groups, Store.loadRecords());
}
function persist() {
  var files = App.files.filter(function (f) { return f.raw; }).map(function (f) {
    return {
      fileName: f.fileName,
      raw: f.raw,
      digest: f.digest || null,
      format: f.format || null
    };
  });
  if (!files.length) { Store.clearSession(); return; }
  Store.saveSession({
    version: 1,
    savedAt: new Date().toISOString(),
    files: files,
    route: { page: App.route.page, groupFile: App.route.groupFile, monthId: App.route.monthId },
    expanded: Object.keys(App.expanded).filter(function (k) { return App.expanded[k]; }),
    activeWeek: App.activeWeek
  });
}

var toastTimer = null;
function toast(msg, kind) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind === 'error' ? ' toast--error' : '');
  if (toastTimer) window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function () { el.className = 'toast'; }, 2600);
}

var Actions = {
  addFiles: function (fileList) {
    var incoming = Array.prototype.slice.call(fileList || []);
    if (!incoming.length) return Promise.resolve();
    return Promise.all(incoming.map(function (file) {
      var entry = {
        fileName: file.name,
        displayName: Parser.displayNameFromFileName(file.name)
      };
      return Store.readFileText(file).then(function (text) {
        entry.text = text;
        entry.digest = FS.digest(text);
        entry.format = FS.detectFormat(text);
        entry.lastModified = typeof file.lastModified === 'number' ? file.lastModified : null;
        var raw;
        try { raw = JSON.parse(text); }
        catch (e) {
          entry.error = '不是合法的 JSON（文件内容无法解析，可能已损坏或被截断）';
          return entry;
        }
        var res = Parser.build(raw, entry.fileName, entry.displayName);
        if (res.ok) { entry.raw = raw; entry.group = res.group; entry.displayName = res.group.displayName; }
        else entry.error = 'JSON 结构不完整：' + res.error;
        return entry;
      }).catch(function (e) {
        entry.error = '文件读取失败：' + ((e && e.message) ? e.message : '未知错误');
        return entry;
      });
    })).then(function (entries) {
      entries.forEach(function (entry) {
        var idx = -1;
        for (var i = 0; i < App.files.length; i++) {
          if (App.files[i].fileName === entry.fileName) { idx = i; break; }
        }
        if (idx >= 0) App.files[idx] = entry; else App.files.push(entry);
      });
      App.route.page = 1;
      rebuildGroups();
      persist();
      Router.render();
      var ok = entries.filter(function (e) { return e.group; }).length;
      var bad = entries.length - ok;
      toast('已载入 ' + ok + ' 个可用文件' + (bad ? '，' + bad + ' 个无法解析' : ''));
    });
  },

  removeFile: function (fileName) {
    AutoSave.cancel(fileName);
    App.files = App.files.filter(function (f) { return f.fileName !== fileName; });
    rebuildGroups();
    if (!App.groups.length) {
      App.route = { page: 1, groupFile: null, monthId: null };
      App.activeWeek = '';
      Store.clearSession();
    } else {
      if (!findGroup(App.route.groupFile)) {
        App.route = { page: Math.min(App.route.page, 2), groupFile: null, monthId: null };
      }
      persist();
    }
    Router.render();
  },

  clearFiles: function () {
    AutoSave.cancelAll();
    App.files = [];
    App.groups = [];
    App.expanded = Object.create(null);
    App.activeWeek = '';
    App.heatTip = '';
    App.dayDetail = '';
    App.route = { page: 1, groupFile: null, monthId: null };
    Store.clearSession();
    Router.render();
    toast('已清空已选文件');
  },

  toOverview: function () {
    if (!App.groups.length) { toast('请先选择至少一个可用文件', 'error'); return; }
    App.route = { page: 2, groupFile: null, monthId: null };
    persist();
    Router.render();
  },

  openGroup: function (fileName) {
    var g = findGroup(fileName);
    if (!g) return;
    var months = Model.monthEntries(g);
    App.route = { page: 3, groupFile: fileName, monthId: months[0] ? months[0].id : null };
    App.activeWeek = '';
    persist();
    Router.render();
  },

  selectMonth: function (monthId) {
    App.route.monthId = monthId;
    App.activeWeek = '';
    App.dayDetail = '';
    persist();
    Router.render();
  },

  openMonth: function (monthId) {
    var g = findGroup(App.route.groupFile);
    if (!g) return;
    var months = Model.monthEntries(g);
    var month = null;
    for (var i = 0; i < months.length; i++) if (months[i].id === monthId) { month = months[i]; break; }
    if (!month) month = months[0];
    if (!month) return;
    App.route = { page: 4, groupFile: g.fileName, monthId: month.id };
    App.activeWeek = month.weeks.length ? (g.fileName + '#' + month.id + '#' + month.weeks[0].id) : '';
    persist();
    Router.render();
  },

  toggleWeek: function (key) {
    if (!key) return;
    if (App.expanded[key]) delete App.expanded[key];
    else {
      App.expanded[key] = true;
      App.activeWeek = key;
    }
    persist();
    Router.render(true);
  },

  toggleTask: function (fileName, taskId, checked) {
    var g = findGroup(fileName);
    if (!g) return;
    var task = null;
    for (var i = 0; i < g.tasks.length; i++) {
      if (g.tasks[i].id === taskId) { task = g.tasks[i]; break; }
    }
    if (!task) return;
    var now = new Date().toISOString();
    var history = (task.history || []).slice();
    history.push({ action: checked ? 'done' : 'undone', at: now });
    task.history = history;
    task.done = !!checked;
    task.doneAt = checked ? now : (task.doneAt || Model.lastDoneAt(task));
    var saved = Store.setRecord(fileName, taskId, {
      done: task.done, doneAt: task.doneAt, history: history
    });
    AutoSave.schedule(fileName, taskId);
    Router.render(true);
    if (!saved) toast('本地存储写入失败，刷新后完成记录可能丢失', 'error');
  },

  heatYear: function (year) {
    if (!year) return;
    App.heatYear = year;
    App.heatTip = '';
    Router.render(true);
  },

  heatDay: function (date) {
    if (!date) return;
    App.heatTip = App.heatTip === date ? '' : date;
    Router.render(true);
  },

  /* 总览「全部科目月历」翻月：基准为当前展示月，未指定时取当月 */
  ovMonthShift: function (delta) {
    var m = /^(\d{4})-(\d{2})$/.exec(App.ovMonth || '');
    var base;
    if (m) base = new Date(+m[1], +m[2] - 1, 1);
    else { var n = new Date(); base = new Date(n.getFullYear(), n.getMonth(), 1); }
    var next = new Date(base.getFullYear(), base.getMonth() + delta, 1);
    App.ovMonth = next.getFullYear() + '-' + U.pad2(next.getMonth() + 1);
    App.dayDetail = '';
    Router.render(true);
  },

  ovMonthToday: function () {
    App.ovMonth = '';
    App.dayDetail = '';
    Router.render(true);
  },

  openDay: function (date) {
    if (!date) return;
    App.dayDetail = date;
    Router.render(true);
  },

  closeDay: function () {
    if (!App.dayDetail) return;
    App.dayDetail = '';
    Router.render(true);
  },

  back: function () {
    var p = App.route.page;
    if (p === 4) App.route.page = 3;
    else if (p === 3) App.route = { page: 2, groupFile: null, monthId: null };
    else App.route = { page: 1, groupFile: null, monthId: null };
    persist();
    Router.render();
  },

  crumb: function (page) {
    if (page === 1) Actions.reselect();
    else if (page === 2) Actions.toOverview();
    else if (page === 3 && App.route.groupFile) {
      App.route.page = 3;
      persist();
      Router.render();
    }
  },

  reselect: function () {
    App.route = { page: 1, groupFile: null, monthId: null };
    persist();
    Router.render();
  },

  exportProgress: function () {
    if (!App.groups.length) { toast('还没有载入题库，无法导出', 'error'); return; }
    var bundle = Model.buildExport(App.groups, Store.loadRecords());
    var d = new Date();
    var stamp = d.getFullYear() + U.pad2(d.getMonth() + 1) + U.pad2(d.getDate()) + '-' +
      U.pad2(d.getHours()) + U.pad2(d.getMinutes());
    Store.download('kyn_progress_' + stamp + '.json', JSON.stringify(bundle, null, 2));
    toast('已导出 ' + App.groups.length + ' 个组的完成记录');
  },

  importProgress: function (file) {
    if (!file) return Promise.resolve();
    return Store.readFileText(file).then(function (text) {
      var data;
      try { data = JSON.parse(text); }
      catch (e) { toast('导入失败：不是合法的 JSON 文件', 'error'); return; }
      var count = Model.collectImportRecords(data, file.name, Store.loadRecords());
      if (!count) { toast('文件里没有可导入的完成记录', 'error'); return; }
      Store.saveRecords();
      rebuildGroups();
      Router.render(true);
      toast('已导入 ' + count + ' 条完成记录');
    }).catch(function (e) {
      toast('导入失败：' + ((e && e.message) ? e.message : '读取错误'), 'error');
    });
  }
};

var Router = (function () {
  var appEl = null;
  var crumbsEl = null;
  var lastPage = 0;

  function sanitize() {
    if (!App.route || !App.route.page) App.route = { page: 1, groupFile: null, monthId: null };
    if (App.route.page >= 2 && !App.groups.length) App.route.page = 1;
    if (App.route.page >= 3) {
      var g = findGroup(App.route.groupFile);
      if (!g) {
        App.route.page = 2;
        App.route.groupFile = null;
        App.route.monthId = null;
      } else {
        var months = Model.monthEntries(g);
        var found = false;
        for (var i = 0; i < months.length; i++) if (months[i].id === App.route.monthId) { found = true; break; }
        if (!found) App.route.monthId = months[0] ? months[0].id : null;
        if (App.route.page === 4 && !App.route.monthId) App.route.page = 3;
      }
    }
    if (App.route.page < 1) App.route.page = 1;
    if (App.route.page > 4) App.route.page = 4;
  }

  function buildCtx() {
    var g = findGroup(App.route.groupFile);
    var months = g ? Model.monthEntries(g) : [];
    var month = null;
    for (var i = 0; i < months.length; i++) if (months[i].id === App.route.monthId) { month = months[i]; break; }
    if (!month) month = months[0] || null;
    if (App.route.page !== 2) App.dayDetail = '';
    return {
      files: App.files,
      groups: App.groups,
      group: g,
      month: month,
      expanded: App.expanded,
      activeWeek: App.activeWeek,
      now: new Date(),
      fs: AutoSave.state(),
      heatYear: App.heatYear,
      heatTip: App.heatTip,
      ovMonth: App.ovMonth,
      dayDetail: App.dayDetail
    };
  }

  function crumbsHtml(ctx) {
    var page = App.route.page;
    var parts = [];
    if (page === 1) parts.push('<span class="crumb-current" aria-current="page">选择题库</span>');
    else parts.push('<button class="crumb" type="button" data-act="crumb" data-page="1">选择题库</button>');
    if (page >= 2) {
      parts.push('<span class="crumb-sep">/</span>');
      parts.push(page === 2
        ? '<span class="crumb-current" aria-current="page">总览</span>'
        : '<button class="crumb" type="button" data-act="crumb" data-page="2">总览</button>');
    }
    if (page >= 3 && ctx.group) {
      parts.push('<span class="crumb-sep">/</span>');
      parts.push(page === 3
        ? '<span class="crumb-current" aria-current="page">' + U.esc(ctx.group.meta.groupName) + '</span>'
        : '<button class="crumb" type="button" data-act="crumb" data-page="3">' + U.esc(ctx.group.meta.groupName) + '</button>');
    }
    if (page === 4 && ctx.month) {
      parts.push('<span class="crumb-sep">/</span>');
      parts.push('<span class="crumb-current" aria-current="page">' + U.esc(ctx.month.label) + '</span>');
    }
    return parts.join('');
  }

  function render(keepScroll) {
    sanitize();
    var ctx = buildCtx();
    var page = App.route.page;
    var html = page === 1 ? Views.page1(ctx)
      : page === 2 ? Views.page2(ctx)
      : page === 3 ? Views.page3(ctx)
      : Views.page4(ctx);
    var y = window.scrollY || window.pageYOffset || 0;
    appEl.innerHTML = html;
    if (keepScroll && lastPage === page) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    crumbsEl.innerHTML = crumbsHtml(ctx);
    document.title = (ctx.group ? ctx.group.meta.groupName + ' · ' : '') +
      ['', '选择任务', '总览', '月度', '周度'][page] + ' · 任务进度追踪';
    lastPage = page;
  }

  function onClick(e) {
    if (e.target && e.target.classList && e.target.classList.contains('cal-detail')) {
      Actions.closeDay();
      return;
    }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act');
    if (act === 'remove-file') Actions.removeFile(el.getAttribute('data-file'));
    else if (act === 'clear-files') Actions.clearFiles();
    else if (act === 'to-overview') Actions.toOverview();
    else if (act === 'open-group') Actions.openGroup(el.getAttribute('data-file'));
    else if (act === 'select-month') Actions.selectMonth(el.getAttribute('data-month'));
    else if (act === 'open-month') Actions.openMonth(el.getAttribute('data-month'));
    else if (act === 'toggle-week') Actions.toggleWeek(el.getAttribute('data-week'));
    else if (act === 'back') Actions.back();
    else if (act === 'crumb') Actions.crumb(+el.getAttribute('data-page'));
    else if (act === 'heat-year') Actions.heatYear(+el.getAttribute('data-year'));
    else if (act === 'heat-day') Actions.heatDay(el.getAttribute('data-date'));
    else if (act === 'ov-month-prev') Actions.ovMonthShift(-1);
    else if (act === 'ov-month-next') Actions.ovMonthShift(1);
    else if (act === 'ov-month-today') Actions.ovMonthToday();
    else if (act === 'open-day') Actions.openDay(el.getAttribute('data-date'));
    else if (act === 'close-day') Actions.closeDay();
    else if (act === 'autosave-toggle') AutoSave.toggle();
    else if (act === 'autosave-auth') AutoSave.enable();
  }

  function onKeydown(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest ? e.target.closest('[data-act][role="button"]') : null;
    if (!el) return;
    e.preventDefault();
    el.click();
  }

  function onChange(e) {
    var cb = e.target;
    if (!cb || cb.tagName !== 'INPUT' || cb.type !== 'checkbox') return;
    var file = cb.getAttribute('data-file');
    var id = cb.getAttribute('data-task-id');
    if (!file || !id) return;
    Actions.toggleTask(file, id, cb.checked);
  }

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    appEl = document.getElementById('app');
    crumbsEl = document.getElementById('crumbs');
    appEl.addEventListener('click', onClick);
    appEl.addEventListener('keydown', onKeydown);
    appEl.addEventListener('change', onChange);
    // 面包屑在 #app 之外，需要单独挂同一套委托事件
    crumbsEl.addEventListener('click', onClick);
    crumbsEl.addEventListener('keydown', onKeydown);

    var fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', function () {
      var files = fileInput.files;
      Actions.addFiles(files).then(function () { fileInput.value = ''; }, function () { fileInput.value = ''; });
    });
    var importInput = document.getElementById('importInput');
    importInput.addEventListener('change', function () {
      var file = importInput.files && importInput.files[0];
      Actions.importProgress(file).then(function () { importInput.value = ''; }, function () { importInput.value = ''; });
    });
    document.getElementById('btnExport').addEventListener('click', Actions.exportProgress);
    document.getElementById('btnReselect').addEventListener('click', Actions.reselect);

    restoreSession();
    render();
    AutoSave.init().then(function () { AutoSave.paint(); });
    if (!Store.storageOK()) toast('浏览器禁用了本地存储，完成记录无法持久化', 'error');
  }

  function restoreSession() {
    var saved = Store.loadSession();
    if (!saved || !Array.isArray(saved.files) || !saved.files.length) return;
    var map = Object.create(null);
    saved.files.forEach(function (item) {
      if (!U.isObj(item) || !item.fileName) return;
      var entry = { fileName: item.fileName, displayName: Parser.displayNameFromFileName(item.fileName) };
      if (typeof item.digest === 'string' && item.digest) entry.digest = item.digest;
      if (U.isObj(item.format)) entry.format = item.format;
      if (U.isObj(item.raw)) {
        var res = Parser.build(item.raw, item.fileName, entry.displayName);
        if (res.ok) { entry.raw = item.raw; entry.group = res.group; entry.displayName = res.group.displayName; }
        else entry.error = '上次载入的数据已失效：' + res.error;
      }
      map[item.fileName] = entry;
    });
    App.files = Object.keys(map).map(function (k) { return map[k]; });
    if (U.isObj(saved.route)) {
      App.route = {
        page: +saved.route.page || 1,
        groupFile: saved.route.groupFile || null,
        monthId: saved.route.monthId || null
      };
    }
    if (Array.isArray(saved.expanded)) {
      saved.expanded.forEach(function (k) { if (typeof k === 'string') App.expanded[k] = true; });
    }
    App.activeWeek = typeof saved.activeWeek === 'string' ? saved.activeWeek : '';
    rebuildGroups();
  }

  return { boot: boot, render: render };
})();

document.addEventListener('DOMContentLoaded', Router.boot);
if (document.readyState === 'complete' || document.readyState === 'interactive') Router.boot();
</script>
</body>
</html>
