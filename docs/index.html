<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>选择任务 · 任务进度追踪</title>
<style>
/* ===== 基础 ===== */
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f4f5f9;color:#1a1d24;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef0f6;padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:#7c8494}
.small{font-size:12px}
h1{font-size:26px;line-height:1.25;margin:0}
h2{font-size:17px;margin:0}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid #e8eaf1}
.topbar-inner{max-width:1160px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#5b7cfa,#9b5bfa)}
.crumbs{display:flex;align-items:center;gap:4px;flex:1;font-size:12.5px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:2px 5px;color:#7c8494;cursor:pointer;border-radius:6px}
.crumb:hover{color:#3d4bff;background:#f2f3fb;text-decoration:underline}
.crumb:focus-visible{outline:2px solid #3d4bff;outline-offset:1px}
.crumb-sep{color:#c6cbd8}
.crumb-current{color:#1a1d24;font-weight:600;padding:2px 5px;cursor:default}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ===== 按钮 ===== */
.btn{
  appearance:none;border:1px solid #dde1ea;background:#fff;color:#293040;padding:7px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
}
.btn:hover{border-color:#c7cde0;box-shadow:0 2px 10px rgba(30,40,80,.06)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-primary{background:#3d4bff;border-color:#3d4bff;color:#fff}
.btn-primary:hover{background:#3240e8;border-color:#3240e8}
.btn-small{padding:4px 10px;font-size:12px;border-radius:7px}
.link-btn{background:none;border:0;padding:2px 4px;color:#5b6478;cursor:pointer;border-radius:6px;font-size:13px}
.link-btn:hover{color:#3d4bff;background:#f2f3fb}
/* ===== 页面容器 ===== */
.app{max-width:1160px;margin:0 auto;padding:28px 24px 64px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.page-head h1 .muted{font-weight:500;font-size:16px}
.lead{margin:6px 0 20px;color:#69718a;font-size:13.5px;max-width:760px}
.card{background:#fff;border:1px solid #e9ebf2;border-radius:16px;box-shadow:0 1px 2px rgba(20,26,50,.04)}
/* ===== 第 1 页 ===== */
.drop{padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  border-style:dashed;border-color:#d8dcea;background:linear-gradient(180deg,#fbfcff,#fff)}
.drop-badge{font-size:12px;letter-spacing:2px;font-weight:700;color:#8b93a6;border:1px solid #e2e6f0;border-radius:8px;padding:4px 10px}
.file-section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e9ebf2;border-radius:12px;padding:11px 14px}
.file-row.is-error{border-color:#f3d0d1;background:#fff8f8}
.file-main{flex:1;min-width:0}
.file-name{font-weight:700;font-size:15px;display:block}
.file-sub{display:block;font-size:12.5px;color:#7c8494;margin-top:1px;word-break:break-word}
.file-row.is-error .file-sub{color:#c93b3f}
.page-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.empty-state{padding:22px;text-align:center;color:#8b93a6;border:1px dashed #e2e6f2;border-radius:12px;background:#fafbfe}
/* ===== 第 2 页 组横条（一列一行） ===== */
.group-grid{display:flex;flex-direction:column;gap:12px}
.group-card{
  position:relative;background:#fff;border:1px solid #e9ebf2;border-left:4px solid var(--gc);
  border-radius:16px;padding:16px 20px;cursor:pointer;transition:.18s;
  box-shadow:0 1px 2px rgba(20,26,50,.04);width:100%;
  display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) minmax(240px,320px);
  align-items:center;gap:20px;min-height:0;
}
.group-card::after{content:"";position:absolute;inset:0;border-radius:15px;background:radial-gradient(80% 160% at 0% 50%,var(--gc-soft),transparent 62%);opacity:.6;pointer-events:none}
.group-card>*{position:relative;z-index:1}
.group-card:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(20,26,50,.08)}
.group-card:focus-visible{outline:2px solid var(--gc);outline-offset:2px}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.group-head>div{min-width:0}
.group-name{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--gc);line-height:1.12;overflow-wrap:anywhere}
.kind-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.kind-study{background:#eef1ff;color:#3d4bff}
.kind-fitness{background:#fff2dd;color:#b9700d}
.group-sub{font-size:12px;color:#8b93a6;margin-top:2px}
.topic-list{margin:0;display:flex;flex-wrap:wrap;gap:5px 6px;min-width:0;align-content:center}
.topic-item{font-size:12px;color:#8a91a1;background:#f6f7fb;border-radius:7px;padding:2px 7px;max-width:100%;display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:4px;line-height:1.5}
.topic-item .ym{white-space:nowrap}
.topic-item b{color:#555e73;font-weight:600;margin-right:3px}
.card-progress{margin-top:0;min-width:0}
.stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:#69718a;margin-bottom:6px}
.stat-label{font-weight:700;color:#293040;font-size:13px}
.stat-nums{font-variant-numeric:tabular-nums;color:#69718a}
.bar{height:8px;background:#edeff5;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .25s ease}
.bar--empty{background:#f2f3f7}
.stat-foot{margin-top:7px;font-size:12.5px;color:#69718a;min-height:19px}
.predict{color:#3f4a63}
.predict::before{content:"◷ ";color:#9aa2b4}
/* ===== 第 3 页 月度 ===== */
.month-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px}
.chip{border:1px solid #e2e5ef;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:#5b6478}
.chip:hover{border-color:#c7cde0}
.chip.is-active{background:#1a1d24;border-color:#1a1d24;color:#fff;font-weight:600}
.stat-panel{padding:16px 18px;display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
.stat-scope{grid-column:1/-1;font-size:12.5px;color:#8b93a6;margin-top:-4px}
.month-list{display:flex;flex-direction:column;gap:14px}
.month-card{padding:16px 18px;cursor:pointer;transition:.16s}
.month-card.is-complete{opacity:.62;background:#fbfcfe}
.month-card.is-complete:hover{opacity:.82}
.month-card:hover{box-shadow:0 10px 26px rgba(20,26,50,.08);border-color:#dfe3ee}
.month-card:focus-visible{outline:2px solid #3d4bff;outline-offset:2px}
.month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.month-head h2{font-size:18px}
.month-done-tag{font-size:11px;font-weight:700;color:#7a8396;background:#eef0f5;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.chev{color:#9aa2b4;font-size:12.5px;white-space:nowrap;margin-top:2px}
.task-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.task-line{display:flex;align-items:center;gap:10px;padding:7px 2px;border-top:1px dashed #eff1f6;font-size:13px}
.task-line:first-child{border-top:1px solid #eff1f6}
.task-line .task-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-line.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.task-line.is-done .task-meta{opacity:.75}
.task-meta{color:#8b93a6;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.prio{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:5px;line-height:1.6}
.prio--P0{background:#fdeaea;color:#c62828}
.prio--P1{background:#fff3e0;color:#b06a00}
.prio--P2{background:#eef0f6;color:#5c6577}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tag--fitness{background:#fff1d9;color:#a8640a}
.tag--study{background:#eef1ff;color:#4152c4}
/* ===== 第 4 页 周度 ===== */
.week-list{display:flex;flex-direction:column;gap:12px}
.week-card{overflow:hidden}
.week-head{
  display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:15px 18px;
  cursor:pointer;text-align:left;
}
.week-head:hover{background:#fbfcff}
.week-head:focus-visible{outline:2px solid #3d4bff;outline-offset:-2px}
.week-head-main{flex:1;min-width:0}
.week-title{display:block;font-weight:700;font-size:15px}
.week-sub{display:block;font-size:12.5px;margin-top:2px}
.week-progress{font-variant-numeric:tabular-nums;font-size:13px;color:#69718a;white-space:nowrap}
.week-progress b{color:#293040}
.chev-arrow{color:#9aa2b4;transition:transform .18s;font-size:12px;width:14px;text-align:center}
.week-card.is-open .chev-arrow{transform:rotate(180deg)}
.week-body{border-top:1px solid #f0f2f7;padding:6px 18px 16px}
.day-group{padding-top:10px}
.day-head{display:flex;align-items:baseline;gap:10px;font-size:12.5px;font-weight:700;color:#5b6478;padding:6px 0 8px}
.day-head .muted{font-weight:400}
.task-row{
  display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;
  background:#fbfcff;border:1px solid #f0f2f7;border-left:3px solid #dbe2f0;margin-bottom:6px;
}
.task-row:hover{background:#f7f9ff}
.task-row--fitness{border-left-color:#e29a2c;background:#fffcf6}
.task-row--fitness:hover{background:#fff8ec}
.task-row input[type="checkbox"]{width:16px;height:16px;margin:2px 0 0;accent-color:#3d4bff;cursor:pointer;flex:none}
.task-row--fitness input[type="checkbox"]{accent-color:#d9901f}
.task-body{flex:1;min-width:0}
.task-row .task-title{display:block;font-size:13.5px;color:#232833;line-height:1.4}
.task-row.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.task-row.is-done{background:#f7f8fb;border-left-color:#c9d0dd}
.task-row.is-done .task-meta{color:#a5acba}
.task-row .task-meta{margin-top:3px;flex-wrap:wrap}
.task-time{font-size:11.5px;color:#8b93a6;white-space:nowrap;padding-top:2px}
.task-time.is-done{color:#2f8f5b}
.task-was{font-size:11px;color:#a0a7b8}
/* ===== 自动写盘状态 ===== */
.autosave{margin-top:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.autosave-main{flex:1;min-width:220px}
.autosave-title{font-weight:800;font-size:13px;color:#293040;margin-right:8px}
.autosave-status{font-size:12.5px;color:#69718a;word-break:break-word}
.autosave-status.is-error{color:#b3261e}
.autosave-note{font-size:12px;color:#8b93a6;margin-top:3px}
.autosave-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ===== 第 2 页 年度热力图 ===== */
.heat-card{padding:16px 18px;margin-bottom:16px}
.heat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.heat-title{font-weight:800;font-size:14px;color:#293040}
.heat-years{display:flex;gap:6px;flex-wrap:wrap}
.heat-year{border:1px solid #e2e5ef;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:#5b6478}
.heat-year.is-active{background:#1a1d24;border-color:#1a1d24;color:#fff;font-weight:700}
.heat-scroll{overflow-x:auto;padding-bottom:2px}
.heat-inner{min-width:max-content}
.heat-months{display:flex;gap:3px;margin-bottom:4px;height:14px;overflow:hidden}
.heat-month{font-size:10px;color:#7c8494;white-space:nowrap;overflow:hidden}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.heat-cell{width:12px;height:12px;border-radius:3px;background:#ebedf0;border:0;padding:0;cursor:pointer;display:block}
.heat-cell:hover{outline:1px solid #9aa2b4}
.heat-cell.lv1{background:#9be9a8}
.heat-cell.lv2{background:#40c463}
.heat-cell.lv3{background:#216e39}
.heat-cell.is-out{opacity:0;pointer-events:none}
.heat-cell.is-active{outline:2px solid #1a1d24;outline-offset:1px}
.heat-foot{margin-top:10px;font-size:12.5px;color:#69718a;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.heat-tip{font-size:12px;color:#5b6478}
.heat-empty{margin-top:2px;font-size:12.5px;color:#8b93a6}
/* ===== 第 3 页 月历 ===== */
.month-cal{margin-bottom:18px;padding:14px 16px}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-title{font-weight:800;font-size:13.5px;color:#293040}
.cal-note{font-size:12px;color:#8b93a6}
.cal-scroll{overflow-x:auto}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:660px}
.cal-weekday{font-size:11px;font-weight:700;color:#9aa2b4;text-align:center;padding-bottom:2px}
.cal-cell{border:1px solid #edf0f6;border-radius:10px;min-height:86px;padding:5px 6px 6px;background:#fff;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cal-cell:hover{border-color:#cfd5e6;background:#fbfcff}
.cal-cell.is-empty{background:#fafbfd;border-style:dashed;color:#aab1bf;cursor:default;min-height:86px}
.cal-cell.is-empty:hover{background:#fafbfd;border-color:#edf0f6}
.cal-day{font-size:11px;font-weight:800;color:#5b6478;display:flex;justify-content:space-between;gap:4px}
.cal-day em{font-style:normal;font-weight:600;color:#9aa2b4}
.cal-task{font-size:10.5px;line-height:1.4;padding:1px 4px;border-radius:4px;border-left:3px solid #dbe2f0;background:#f6f7fb;color:#3f4759;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-task--P0{background:#fdeaea;border-left-color:#c62828;color:#8e1f1f;font-weight:700}
.cal-task--P1{background:#fff3e0;border-left-color:#d68a1e;color:#7d5200}
.cal-task--P2{background:#eef0f6;border-left-color:#98a2b6;color:#4f586b}
.cal-task--fitness{background:#e9f7ef;border-left-color:#2f8f5b;color:#24724a;font-weight:700}
.cal-task.is-done{background:#f3f4f8;border-left-color:#c7ccd8;color:#98a0b0;font-weight:400;text-decoration:line-through;text-decoration-color:#c3cad9}
.cal-min{margin-top:auto;font-size:10px;color:#9aa2b4}
.cal-detail{position:fixed;inset:0;background:rgba(15,20,35,.38);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.cal-modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:82vh;overflow:auto;padding:18px 20px;box-shadow:0 24px 60px rgba(10,15,30,.28)}
.cal-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.cal-modal h3{font-size:17px}
.cal-modal-sub{font-size:12.5px;color:#8b93a6;margin-top:2px}
.cal-day-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cal-day-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-top:1px dashed #eff1f6;font-size:13px}
.cal-day-row:first-child{border-top:1px solid #eff1f6}
.cal-day-row .task-title{flex:1;min-width:0}
.cal-day-row.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.cal-day-row .task-meta{color:#8b93a6;font-size:12px;display:flex;gap:8px;align-items:center}
/* ===== 第 2 页 当月全部科目月历 ===== */
.cal-cell--multi{min-height:96px}
.cal-nav{display:flex;gap:6px;align-items:center;margin-left:auto}
.cal-subj{display:flex;align-items:baseline;gap:4px;font-size:10.5px;line-height:1.4;padding:1px 5px;border-radius:4px;
  border-left:3px solid var(--sc);background:var(--sc-soft);color:#3f4759;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-subj i{width:5px;height:5px;border-radius:50%;background:var(--sc);flex:none;align-self:center}
.cal-subj b{font-weight:700;flex:none;max-width:4.6em;overflow:hidden;text-overflow:ellipsis}
.cal-subj.is-done{opacity:.55}
.cal-subj--tag{font-size:11px;padding:1px 7px;align-items:center}
.cal-more{font-size:10px;color:#9aa2b4;padding-left:2px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:#69718a}
.cal-legend-item{display:inline-flex;align-items:center;gap:5px}
.cal-legend-dot{width:8px;height:8px;border-radius:3px;flex:none}
/* ===== 提示条 ===== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
  background:#1f2430;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 10px 30px rgba(10,15,30,.25);transition:.2s;z-index:50;max-width:80vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast--error{background:#b3261e}
@media (max-width:720px){
  .app{padding:20px 16px 52px}
  .topbar-inner{padding:10px 16px}
  .stat-panel{grid-template-columns:1fr;gap:14px}
  .group-grid{gap:10px}
  .group-card{grid-template-columns:1fr;gap:10px;padding:14px 16px}
  .group-name{font-size:24px}
  .topic-list{justify-content:flex-start}
  .task-line{flex-wrap:wrap}
  .task-line .task-title{white-space:normal}
  .page-actions{flex-direction:column-reverse}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">任务进度追踪</div>
    <nav class="crumbs" id="crumbs" aria-label="面包屑导航"></nav>
    <div class="top-actions">
      <button class="btn" id="btnExport" type="button">导出</button>
      <label class="btn" for="importInput">导入进度</label>
      <button class="btn" id="btnReselect" type="button">重新选择</button>
    </div>
  </div>
</header>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div style="padding:24px">本页面需要启用 JavaScript 才能使用。</div></noscript>
<input id="fileInput" type="file" accept=".json,application/json" multiple hidden />
<input id="importInput" type="file" accept=".json,application/json" hidden />
<script>
'use strict';
/* =============================================================================
 * 模块 1  文件解析  Parser
 * 职责：把原始 JSON 变成「组模型」；负责字段校验、缺失容错、警告收集
 * 不做：读写文件（Store）、进度计算（Model）、渲染（Views）
 * ========================================================================== */
var DAY = 86400000;

var U = {
  esc: function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

      strong: 'hsl(' + h + ', 62%, 42%)',
      soft: 'hsl(' + h + ', 80%, 96%)',
      light: 'hsl(' + h + ', 70%, 90%)'
    };
  }

  /* 考研科目优先级：按分值权重（数学/专业课各 150 分）+ 复习周期 + 提分难度排序。
     规则可扩展：新增科目只需在数组里加一条 rank 与匹配规则；非考研任务按 meta.priority，缺省按 a-z */
  var EXAM_SUBJECT_ORDER = [
    { rank: 0, label: '数学', test: /数学|数一|数二|数三|math/i },
    { rank: 1, label: '专业课', test: /408|专业课|专业基础|computer|cs408/i },
    { rank: 2, label: '英语', test: /英语|英一|英二|英文|english|eng2/i },
    { rank: 3, label: '政治', test: /政治|思政|politics/i }
  ];
  var RANK_EXAM_BASE = 0;      // 考研科目 0-3
  var RANK_OTHER_BASE = 10;    // 非考研学习任务：10 + meta.priority（P0/P1/P2），无优先级为 13
  var RANK_FITNESS = 900;      // 健身固定最后

  function groupHaystack(g) {
    var m = g.meta || {};
    return String((m.subject || '') + ' ' + (m.groupName || '') + ' ' + (g.fileName || '')).toLowerCase();
  }
  function subjectRank(g) {
    var kind = g.meta && g.meta.kind;
    if (kind === 'fitness') return RANK_FITNESS;
    var hay = groupHaystack(g);
    for (var i = 0; i < EXAM_SUBJECT_ORDER.length; i++) {
      if (EXAM_SUBJECT_ORDER[i].test.test(hay)) return RANK_EXAM_BASE + EXAM_SUBJECT_ORDER[i].rank;
    }
    var prio = g.meta && g.meta.priority;
    return RANK_OTHER_BASE + (PRIO[prio] != null ? PRIO[prio] : 3);
  }
  /* 组排序：考研科目按复习优先级 → 其他任务按自身优先级 → 名称 a-z（不区分大小写）→ 文件名兜底 */
  function sortGroups(groups) {
    return groups.slice().sort(function (a, b) {
      var ra = subjectRank(a), rb = subjectRank(b);
      if (ra !== rb) return ra - rb;
      var na = String((a.meta && a.meta.groupName) || a.fileName || '').toLowerCase();
      var nb = String((b.meta && b.meta.groupName) || b.fileName || '').toLowerCase();
      if (na !== nb) return na < nb ? -1 : 1;
      return a.fileName < b.fileName ? -1 : a.fileName > b.fileName ? 1 : 0;
    });
  }

  /* 预计完成时间：近 14 天加权（近 7 天权重 2）→ 退回整体平均；速率过低返回「数据不足」 */
  function predict(tasks, planStartISO, now) {
    now = now || new Date();
    var total = tasks.length;
    if (total === 0) return { ok: false, label: '数据不足', detail: '该范围暂无任务' };
    var doneTasks = tasks.filter(function (t) { return t.done; });
    var remaining = total - doneTasks.length;
    if (remaining === 0) {
      return { ok: true, completed: true, remaining: 0, rate: 0, label: '已全部完成', detail: '该范围任务已全部完成' };
    }
    var today = startOf(now);
    var recent = 0, prev = 0;
    doneTasks.forEach(function (t) {
      if (!t.doneAt) return;
      var d = new Date(t.doneAt);
      if (isNaN(d.getTime())) return;
      var diff = Math.round((today.getTime() - startOf(d).getTime()) / DAY);
      if (diff >= 0 && diff <= 6) recent += 1;
      else if (diff >= 7 && diff <= 13) prev += 1;
    });
    var rate = (2 * (recent / 7) + 1 * (prev / 7)) / 3;
    var basis = '近14天加权';
    var detail = '近7天完成 ' + recent + ' 项，前7天 ' + prev + ' 项；加权速率 ' + rate.toFixed(2) +
      ' 项/天，剩余 ' + remaining + ' 项';
    if (rate <= 0) {
      var start = planStartISO ? Parser.parseISODate(planStartISO) : null;
      if (!start) start = today;
      var days = Math.max(1, Math.round((today.getTime() - startOf(start).getTime()) / DAY) + 1);
      rate = doneTasks.length / days;
      basis = '整体平均';
      detail = '无近期完成时间可用，按整体平均：已完成 ' + doneTasks.length + ' 项 / ' + days +
        ' 天 = ' + rate.toFixed(2) + ' 项/天，剩余 ' + remaining + ' 项';
    }
    if (!(rate > 0) || rate < 0.02) {
      return { ok: false, label: '数据不足', basis: basis, rate: rate, detail: detail + '；速率过低，暂不给出预计日期' };
    }
    var need = Math.ceil(remaining / rate);
    if (need > 1825) {
      return { ok: false, label: '数据不足', basis: basis, rate: rate, detail: detail + '；据此推算超过 5 年' };
    }
    var date = addDays(today, need);
    return {
      ok: true, completed: false, remaining: remaining, rate: rate, needDays: need, date: date, basis: basis,
      label: '预计 ' + fmtMD(date, now) + '完成所有任务',
      detail: detail + '；预计还需 ' + need + ' 天（' + basis + '）'
    };
  }

  /* 本地记录覆盖 JSON 初始值；没有本地记录时回到 JSON 的 done/doneAt/history */
  function applyProgress(groups, records) {
    groups.forEach(function (g) {
      g.tasks.forEach(function (t) {
        var rec = records ? records[g.fileName + '::' + t.id] : null;
        if (rec && typeof rec.done === 'boolean') {
          t.done = rec.done;
          t.doneAt = rec.doneAt || null;
          t.history = U.cleanHistory(rec.history);
          if (!t.history.length && t.done && t.doneAt) t.history = [{ action: 'done', at: t.doneAt }];
        } else {
          t.done = t.initialDone;
          t.doneAt = t.initialDoneAt;
          t.history = (t.initialHistory || []).slice();
        }
      });
    });
  }

  /* 导出：把所有组的完成时间与勾选历史写回各自的 JSON，并附一份记录表 */
  function buildExport(groups, records) {
    var progress = {};
    Object.keys(records || {}).forEach(function (k) {
      var rec = records[k];
      progress[k] = {
        done: !!rec.done,
        doneAt: rec.doneAt || null,
        history: U.cleanHistory(rec.history)
      };
    });
    var outGroups = groups.map(function (g) {
      var clone = null;
      try { clone = JSON.parse(JSON.stringify(g.raw)); } catch (e) { clone = null; }
      if (clone) {
        var byId = Object.create(null);
        g.tasks.forEach(function (t) { byId[t.id] = t; });
        U.arr(clone.months).forEach(function (m) {
          U.arr(m.weeks).forEach(function (w) {
            U.arr(w.days).forEach(function (d) {
              U.arr(d.tasks).forEach(function (t) {
                var model = U.isObj(t) && t.id != null ? byId[t.id] : null;
                if (model) {
                  t.done = !!model.done;
                  t.doneAt = model.doneAt || null;
                  var hist = U.cleanHistory(model.history);
                  if (hist.length) t.history = hist;
                  else delete t.history;
                }
              });
            });
          });
        });
      }
      return { fileName: g.fileName, groupName: g.meta.groupName, data: clone };
    });
    return {
      type: 'kyn-progress-export',
      version: 1,
      exportedAt: new Date().toISOString(),
      note: '由「任务进度追踪」导出，可用「导入进度」恢复',
      progress: progress,
      groups: outGroups
    };
  }

  /* 解析导入文件：支持本程序的导出包、单组 JSON、或纯记录表；返回写入条数 */
  function collectImportRecords(data, fileName, target) {
    var count = 0;
    function take(f, id, done, doneAt, history) {
      if (!f || id == null || String(id) === '') return;
      target[String(f) + '::' + String(id)] = {
        done: !!done,
        doneAt: (typeof doneAt === 'string' && doneAt) ? doneAt : null,
        history: U.cleanHistory(history)
      };
      count += 1;
    }
    function fromGroupJson(obj, fname) {
      if (!U.isObj(obj) || !Array.isArray(obj.months)) return;
      obj.months.forEach(function (m) {
        U.arr(m.weeks).forEach(function (w) {
          U.arr(w.days).forEach(function (d) {
            U.arr(d.tasks).forEach(function (t) {
              if (U.isObj(t) && t.id != null) take(fname, t.id, t.done, t.doneAt, t.history);
            });
          });
        });
      });
    }
    if (Array.isArray(data.groups)) {
      data.groups.forEach(function (item) {
        if (U.isObj(item) && U.isObj(item.data)) fromGroupJson(item.data, U.text(item.fileName));
      });
    } else if (U.isObj(data.meta) && Array.isArray(data.months)) {
      fromGroupJson(data, fileName);
    }
    /* progress 表最后写入，优先级最高；没有 history 的旧文件照常兼容 */
    if (U.isObj(data.progress)) {
      Object.keys(data.progress).forEach(function (k) {
        var rec = data.progress[k];
        if (!U.isObj(rec) || k.indexOf('::') < 0 || typeof rec.done !== 'boolean') return;
        target[k] = {
          done: rec.done,
          doneAt: rec.doneAt || null,
          history: U.cleanHistory(rec.history)
        };
        count += 1;
      });
    }
    return count;
  }

  return {
    prioRank: prioRank, startOf: startOf, addDays: addDays, fmtMD: fmtMD, fmtRange: fmtRange,
    weekdayText: weekdayText, fmtMinutes: fmtMinutes, doneText: doneText,
    timeText: timeText, lastDoneAt: lastDoneAt, lastDoneText: lastDoneText,
    tasksInRange: tasksInRange, studyInRange: studyInRange, fitnessInRange: fitnessInRange,
    tasksInMonth: tasksInMonth, fitnessInMonth: fitnessInMonth,
    weekTasks: weekTasks, stats: stats, sortByPriority: sortByPriority, sortByDate: sortByDate,
    sortForDisplay: sortForDisplay, allDone: allDone,
    sortCalendar: sortCalendar, completionByDay: completionByDay, uniqueTaskStats: uniqueTaskStats,
    groupByDay: groupByDay, monthRange: monthRange, monthEntries: monthEntries,
    topicSummaries: topicSummaries, groupColor: groupColor, predict: predict,
    sortGroups: sortGroups, subjectRank: subjectRank,
    applyProgress: applyProgress, buildExport: buildExport, collectImportRecords: collectImportRecords
  };
})();

/* =============================================================================
 * 模块 3  状态与持久化  Store
 * 职责：唯一负责「读本地文件 / 写下载文件 / localStorage」的模块
 * 其余模块不得直接使用 FileReader 或 localStorage
 * ========================================================================== */
var Store = (function () {
  var K_PROGRESS = 'kyn.progress.v1';
  var K_SESSION = 'kyn.session.v1';
  var records = null;
  var session = null;
  var storageOK = true;

  function safeGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { storageOK = false; return null; }
  }
  function safeSet(key, value) {
    try { window.localStorage.setItem(key, value); return true; }
    catch (e) { storageOK = false; return false; }
  }

  function loadRecords() {
    if (records) return records;
    var raw = safeGet(K_PROGRESS);
    records = {};
    if (!raw) return records;
    try {
      var data = JSON.parse(raw);
      var body = U.isObj(data) && U.isObj(data.records) ? data.records : data;
      if (U.isObj(body)) {
        Object.keys(body).forEach(function (k) {
          var rec = body[k];
          if (U.isObj(rec) && typeof rec.done === 'boolean') {
            records[k] = {
              done: rec.done,
              doneAt: rec.doneAt || null,
              history: U.cleanHistory(rec.history)
            };
          }
        });
      }
    } catch (e) { records = {}; }
    return records;
  }
  function saveRecords() {
    return safeSet(K_PROGRESS, JSON.stringify({
      version: 1,
      updatedAt: new Date().toISOString(),
      records: loadRecords()
    }));
  }
  function keyFor(fileName, taskId) { return String(fileName) + '::' + String(taskId); }
  function setRecord(fileName, taskId, rec) {
    loadRecords()[keyFor(fileName, taskId)] = {
      done: !!rec.done,
      doneAt: rec.doneAt || null,
      history: U.cleanHistory(rec.history)
    };
    return saveRecords();
  }

  /* 刷新后回到上次的文件与页面（文件内容缓存在 localStorage，只读一次盘） */
  function loadSession() {
    if (session !== null) return session;
    var raw = safeGet(K_SESSION);
    session = null;
    if (!raw) return null;
    try { session = JSON.parse(raw); } catch (e) { session = null; }
    return U.isObj(session) ? session : null;
  }
  function saveSession(payload) {
    session = payload;
    return safeSet(K_SESSION, JSON.stringify(payload));
  }

  function readFileText(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error('没有文件')); return; }
      try {
        var reader = new FileReader();
        reader.onload = function () { resolve(String(reader.result == null ? '' : reader.result)); };
        reader.onerror = function () { reject(new Error('读取失败')); };
        reader.readAsText(file, 'utf-8');
      } catch (e) { reject(e); }
    });
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    window.setTimeout(function () {
      URL.revokeObjectURL(url);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 0);
  }

  function clearSession() {
    session = null;
    try { window.localStorage.removeItem(K_SESSION); } catch (e) { /* 忽略 */ }
  }
  function loadPrefs() {
    var raw = safeGet('kyn.autosave.v1');
    if (!raw) return null;
    try { var o = JSON.parse(raw); return U.isObj(o) ? o : null; } catch (e) { return null; }
  }
  function savePrefs(o) { return safeSet('kyn.autosave.v1', JSON.stringify(o)); }

  return {
    loadRecords: loadRecords,
    saveRecords: saveRecords,
    setRecord: setRecord,
    keyFor: keyFor,
    loadSession: loadSession,
    saveSession: saveSession,
    clearSession: clearSession,
    loadPrefs: loadPrefs,
    savePrefs: savePrefs,
    readFileText: readFileText,
    download: download,
    storageOK: function () { return storageOK; }
  };
})();

/* =============================================================================
 * 模块 3.5  文件系统与自动写盘  FS / AutoSave
 * File System Access API：目录选择、IndexedDB 句柄持久化、权限查询、摘要比对、静默写回
 * 只写回被勾选的组 JSON，保留原结构与键序，只改 done / doneAt / history（及原文件已有的 progress 段）
 * ========================================================================== */
var FS = (function () {
  var DB_NAME = 'kyn.fs.v1';
  var STORE = 'handles';
  var dbPromise = null;

  function supported() {
    return typeof window.showDirectoryPicker === 'function';
  }
  function openDB() {
    if (typeof window.indexedDB === 'undefined') return Promise.reject(new Error('浏览器不支持 IndexedDB'));
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = window.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('IndexedDB 打开失败')); };
    });
    return dbPromise;
  }
  function idbSet(key, value) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error); };
      });
    });
  }
  function idbGet(key) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function pickDirectory() {
    if (!supported()) return Promise.reject(new Error('当前浏览器不支持 showDirectoryPicker'));
    return window.showDirectoryPicker({ mode: 'readwrite', id: 'kyn-autosave' });
  }
  function permission(handle) {
    if (!handle || typeof handle.queryPermission !== 'function') return Promise.resolve('granted');
    return Promise.resolve(handle.queryPermission({ mode: 'readwrite' })).then(null, function () { return 'denied'; });
  }
  function requestPermission(handle) {
    if (!handle || typeof handle.requestPermission !== 'function') return Promise.resolve('granted');
    return Promise.resolve(handle.requestPermission({ mode: 'readwrite' })).then(null, function () { return 'denied'; });
  }

  /* FNV-1a 32 位摘要：用于检测文件是否被外部修改，不追求加密强度 */
  function digest(text) {
    var h = 0x811c9dc5;
    for (var i = 0; i < text.length; i++) {
      h = Math.imul(h ^ text.charCodeAt(i), 16777619) >>> 0;
    }
    return ('0000000' + h.toString(16)).slice(-8);
  }
  function defaultFormat() { return { indent: '  ', crlf: false, trailing: true }; }
  /* 探测原文件的缩进、换行与结尾换行，写回时尽量保持原格式 */
  function detectFormat(text) {
    var crlf = text.indexOf('\r\n') >= 0;
    var indent = '  ';
    var m = /\n([ \t]+)"/.exec(text);
    if (m) indent = m[1];
    var trailing = /(\r\n|\n)$/.test(text);
    return { indent: indent, crlf: crlf, trailing: trailing };
  }
  function serialize(raw, fmt) {
    fmt = fmt || defaultFormat();
    var out = JSON.stringify(raw, null, fmt.indent);
    if (fmt.crlf) out = out.replace(/\n/g, '\r\n');
    if (fmt.trailing) out += fmt.crlf ? '\r\n' : '\n';
    return out;
  }
  function writeText(fileHandle, text) {
    return Promise.resolve(fileHandle.createWritable()).then(function (w) {
      return Promise.resolve(w.write(text)).then(function () { return w.close(); });
    });
  }
  function errorText(e) {
    if (!e) return '未知错误';
    if (e.name === 'NotFoundError') return '目录中找不到该文件';
    if (e.name === 'NotAllowedError') return '没有写入权限（可能被拒绝或授权已过期）';
    if (e.name === 'AbortError') return '操作已取消';
    if (e.name === 'SecurityError') return '当前环境不允许文件系统访问';
    return e.message || e.name || '未知错误';
  }

  return {
    supported: supported,
    pickDirectory: pickDirectory,
    permission: permission,
    requestPermission: requestPermission,
    digest: digest,
    defaultFormat: defaultFormat,
    detectFormat: detectFormat,
    serialize: serialize,
    writeText: writeText,
    errorText: errorText,
    idbSet: idbSet,
    idbGet: idbGet
  };
})();

var AutoSave = (function () {
  var WRITE_DELAY = 1000;
  var state = {
    supported: FS.supported(),
    enabled: false,
    handle: null,
    dirName: '',
    needAuth: false,
    authFailed: false,
    lastAt: null,
    error: '',
    status: '未关联目录'
  };
  var timers = Object.create(null);
  var pending = Object.create(null);

  function clockText(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return U.pad2(d.getHours()) + ':' + U.pad2(d.getMinutes()) + ':' + U.pad2(d.getSeconds());
  }
  function refreshStatus() {
    if (!state.supported) {
      state.status = '当前浏览器不支持 File System Access API，自动写盘不可用；勾选仍保存在本机，可继续导出';
      return state.status;
    }
    if (state.error) { state.status = state.error; return state.status; }
    if (!state.handle) { state.status = '未关联目录'; return state.status; }
    var base = '已关联到「' + (state.dirName || '已选目录') + '」';
    if (state.needAuth) { state.status = base + ' · 需要重新授权'; return state.status; }
    if (!state.enabled) { state.status = base + ' · 自动写盘已暂停'; return state.status; }
    state.status = base + (state.lastAt ? ' · 上次写回 ' + clockText(state.lastAt) : ' · 等待首次写回');
    return state.status;
  }
  /* 只刷新状态行，避免写回成功后整页重绘打断用户操作 */
  function paint() {
    refreshStatus();
    var el = document.getElementById('autosaveStatus');
    if (!el) return;
    el.textContent = state.status;
    el.className = 'autosave-status' + (state.error ? ' is-error' : '');
  }
  function fail(msg) {
    state.error = msg;
    paint();
  }
  function persistPrefs() {
    Store.savePrefs({ enabled: !!state.enabled, dirName: state.dirName || '' });
  }
  function entryOf(fileName) {
    for (var i = 0; i < App.files.length; i++) {
      if (App.files[i].fileName === fileName) return App.files[i];
    }
    return null;
  }

  function init() {
    if (!state.supported) { refreshStatus(); return Promise.resolve(false); }
    var prefs = Store.loadPrefs();
    if (prefs) {
      if (typeof prefs.dirName === 'string') state.dirName = prefs.dirName;
      if (typeof prefs.enabled === 'boolean') state.enabled = prefs.enabled;
    }
    return FS.idbGet('dir').then(function (h) {
      if (!h) { state.enabled = false; refreshStatus(); return false; }
      state.handle = h;
      state.dirName = (typeof h.name === 'string' && h.name) || state.dirName || '已选目录';
      return FS.permission(h).then(function (p) {
        if (p === 'granted') { state.needAuth = false; state.authFailed = false; }
        else {
          state.needAuth = true;
          state.enabled = false;
          if (p === 'denied') {
            state.authFailed = true;
            state.error = '目录写入授权已失效，自动写盘已停用；可重新授权或改用「导出」';
          }
        }
        refreshStatus();
        return true;
      });
    }).catch(function () {
      state.enabled = false;
      refreshStatus();
      return false;
    });
  }

  function associate() {
    state.error = '';
    return FS.pickDirectory().then(function (dir) {
      state.handle = dir;
      state.dirName = (typeof dir.name === 'string' && dir.name) || '已选目录';
      return FS.permission(dir).then(function (p) {
        if (p !== 'granted') {
          state.enabled = false;
          state.needAuth = true;
          state.authFailed = true;
          state.error = '目录写入授权被拒绝，自动写盘已停用；请重新授权或改用「导出」';
          persistPrefs();
          refreshStatus();
          Router.render(true);
          return false;
        }
        state.enabled = true;
        state.needAuth = false;
        state.authFailed = false;
        persistPrefs();
        refreshStatus();
        return FS.idbSet('dir', dir).catch(function () { return null; }).then(function () {
          Router.render(true);
          toast('已关联目录「' + state.dirName + '」，自动写盘已开启');
          return true;
        });
      });
    }).catch(function (e) {
      if (e && e.name === 'AbortError') { refreshStatus(); paint(); return false; }
      state.error = '关联目录失败：' + FS.errorText(e);
      state.authFailed = !!(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'));
      refreshStatus();
      Router.render(true);
      return false;
    });
  }
  function requestEnable() {
    if (!state.handle) return associate();
    state.error = '';
    return FS.requestPermission(state.handle).then(function (p) {
      if (p !== 'granted') {
        state.needAuth = true;
        state.enabled = false;
        state.authFailed = true;
        state.error = '目录写入授权被拒绝，自动写盘已停用；请重新授权或改用「导出」';
        refreshStatus(); persistPrefs(); Router.render(true);
        return false;
      }
      state.needAuth = false;
      state.authFailed = false;
      state.enabled = true;
      state.error = '';
      refreshStatus(); persistPrefs(); Router.render(true);
      toast('自动写盘已开启');
      return true;
    }).catch(function (e) {
      state.needAuth = true;
      state.enabled = false;
      state.authFailed = !!(e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'));
      state.error = '授权失败：' + FS.errorText(e);
      refreshStatus(); Router.render(true);
      return false;
    });
  }
  function toggle() {
    if (!state.supported) { toast('当前浏览器不支持自动写盘', 'error'); return; }
    if (state.enabled) {
      state.enabled = false;
      state.error = '';
      refreshStatus(); persistPrefs(); Router.render(true);
      toast('已关闭自动写盘（勾选仍保存在本机）');
      return;
    }
    if (!state.handle) { associate(); return; }
    requestEnable();
  }

  /* 写回时只更新目标任务：done / doneAt / history */
  function applyTask(raw, taskId, rec) {
    var found = false;
    function walk(list, cb) { U.arr(list).forEach(cb); }
    walk(raw.months, function (m) {
      walk(m && m.weeks, function (w) {
        walk(w && w.days, function (d) {
          walk(d && d.tasks, function (t) {
            if (!U.isObj(t) || t.id == null || String(t.id) !== String(taskId)) return;
            t.done = !!rec.done;
            t.doneAt = rec.doneAt || null;
            var hist = U.cleanHistory(rec.history);
            if (hist.length) t.history = hist; else delete t.history;
            found = true;
          });
        });
      });
    });
    return found;
  }
  /* 若原文件自带 progress 段，也同步更新其中的记录（不改动其它键） */
  function applyProgress(raw, fileName, ids, records) {
    if (!U.isObj(raw.progress)) return;
    ids.forEach(function (id) {
      var rec = records[fileName + '::' + id];
      if (!rec) return;
      [String(id), fileName + '::' + String(id)].forEach(function (k) {
        var p = raw.progress[k];
        if (!U.isObj(p)) return;
        p.done = !!rec.done;
        if ('doneAt' in p) p.doneAt = rec.doneAt || null;
        var hist = U.cleanHistory(rec.history);
        if (hist.length) p.history = hist; else if ('history' in p) p.history = [];
      });
    });
  }

  function flush(fileName) {
    var ids = Object.keys(pending[fileName] || {});
    delete pending[fileName];
    if (!state.enabled || !state.handle || !ids.length) return Promise.resolve(false);
    var entry = entryOf(fileName);
    if (!entry || !entry.group) {
      fail('写回失败：找不到已载入的组「' + fileName + '」');
      return Promise.resolve(false);
    }
    var fmt = entry.format || FS.defaultFormat();
    return FS.permission(state.handle).then(function (p) {
      if (p !== 'granted') {
        state.needAuth = true;
        state.enabled = false;
        state.authFailed = true;
        fail('目录写入授权已失效，自动写盘已停用；请点「重新授权」后重试');
        return false;
      }
      return state.handle.getFileHandle(fileName).then(function (fh) {
        return fh.getFile().then(function (file) {
          return file.text().then(function (current) {
            var baseline = entry.digest || null;
            if (baseline && FS.digest(current) !== baseline) {
              var ok = window.confirm('检测到「' + fileName + '」已被外部修改。\n是否用当前页面的记录覆盖它？\n点「取消」则不覆盖，可改用「导出」备份。');
              if (!ok) {
                fail('文件已变化，已跳过写回「' + fileName + '」（可改用导出）');
                return false;
              }
            }
            var clone = JSON.parse(JSON.stringify(entry.group.raw));
            var records = Store.loadRecords();
            var changed = [];
            ids.forEach(function (id) {
              var rec = records[fileName + '::' + id];
              if (!rec) return;
              if (applyTask(clone, id, rec)) changed.push(id);
            });
            applyProgress(clone, fileName, changed, records);
            if (!changed.length) {
              fail('写回失败：目标任务的 id 在原 JSON 中不存在');
              return false;
            }
            var text = FS.serialize(clone, fmt);
            return FS.writeText(fh, text).then(function () {
              entry.group.raw = clone;
              entry.raw = clone;
              entry.text = text;
              entry.digest = FS.digest(text);
              state.lastAt = new Date().toISOString();
              state.error = '';
              refreshStatus();
              paint();
              if (typeof fh.getFile === 'function') {
                Promise.resolve(fh.getFile()).then(function (f2) {
                  entry.lastModified = f2.lastModified;
                }).catch(function () { /* 忽略 */ });
              }
              toast('已静默写回「' + fileName + '」' + (changed.length > 1 ? '（' + changed.length + ' 项）' : ''));
              return true;
            });
          });
        });
      });
    }).catch(function (e) {
      fail('写回失败：' + FS.errorText(e));
      return false;
    });
  }

  function schedule(fileName, taskId) {
    if (!state.supported || !state.enabled || !state.handle || !fileName) return false;
    if (!pending[fileName]) pending[fileName] = Object.create(null);
    if (taskId != null) pending[fileName][String(taskId)] = true;
    if (timers[fileName]) window.clearTimeout(timers[fileName]);
    timers[fileName] = window.setTimeout(function () {
      delete timers[fileName];
      flush(fileName);
    }, WRITE_DELAY);
    return true;
  }
  function cancel(fileName) {
    if (timers[fileName]) { window.clearTimeout(timers[fileName]); delete timers[fileName]; }
    delete pending[fileName];
  }
  function cancelAll() {
    Object.keys(timers).forEach(function (k) { window.clearTimeout(timers[k]); });
    timers = Object.create(null);
    pending = Object.create(null);
  }
  function view() { refreshStatus(); return state; }

  return {
    init: init,
    state: view,
    paint: paint,
    toggle: toggle,
    associate: associate,
    enable: requestEnable,
    schedule: schedule,
    cancel: cancel,
    cancelAll: cancelAll,
    flushNow: flush
  };
})();

/* =============================================================================
 * 模块 4  各页渲染  Views
 * 每个页面只读取 ctx（state + 模型 + actions），互不依赖对方内部数据

var Views = (function () {

  function autosaveBlock(ctx) {
    var fs = (ctx && ctx.fs) || { supported: false, status: '未关联目录' };
    var status = fs.status || '未关联目录';

            ? '关联目录后，勾选/取消会防抖 1 秒静默写回该组 JSON；检测到外部改动会先询问，不会静默覆盖。'
            : '当前浏览器不支持 File System Access API，自动写盘不可用；勾选仍保存在本机，可继续导出。') +

  function page1(ctx) {
    var files = ctx.files;
    var valid = files.filter(function (f) { return f.group; }).length;
    /* 已选择列表：按科目优先级（考研科目顺序 → 其他任务优先级 → 名称 → 文件名）；无可用数据的文件排最后 */
    var sortedFiles = files.slice().sort(function (a, b) {

    var rows = sortedFiles.map(function (f) {

        '<div class="file-row' + (f.error ? ' is-error' : '') + '">' +

            '<span class="file-sub">' + (f.error

              : (f.group.tasks.length + ' 项任务 · ' + Model.monthEntries(f.group).length + ' 个月 · ' +
                 f.group.meta.subject + warnLine(f.group))) + '</span>' +

    return '' +
      '<section class="page page-1">' +
        '<div class="page-head"><h1>选择任务 · 任务进度追踪</h1></div>' +
